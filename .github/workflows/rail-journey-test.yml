name: Test planera kolejowego (bez SMS)

on:
  workflow_dispatch:
    inputs:
      from:
        description: Stacja początkowa
        required: true
        default: Katowice
        type: string
      to:
        description: Stacja docelowa
        required: true
        default: Zamość
        type: string
      travel_date:
        description: Data lub określenie naturalne, np. jutro
        required: true
        default: jutro
        type: string
      preferred_time:
        description: Preferowana pora, np. rano albo 08:00
        required: true
        default: rano
        type: string
      reply_parts:
        description: Limit długości odpowiedzi
        required: true
        default: "4"
        type: choice
        options:
          - "1"
          - "3"
          - "4"
      expected_source:
        description: Oczekiwana ścieżka planera
        required: true
        default: local
        type: choice
        options:
          - any
          - local
          - live
      expect_route:
        description: Nie zaliczaj testu, jeśli planer nie zwróci trasy
        required: true
        default: true
        type: boolean
      expected_legs:
        description: Oczekiwany kształt trasy
        required: true
        default: any
        type: choice
        options:
          - any
          - one
          - multiple
      expected_variants:
        description: Minimalna liczba wariantów (0 wyłącza sprawdzanie)
        required: true
        default: "1"
        type: choice
        options:
          - "0"
          - "1"
          - "2"
          - "3"
      use_live_fallback:
        description: Włącz awaryjne zapytania do PKP (zużywa limit API)
        required: true
        default: false
        type: boolean
      refresh_gtfs:
        description: Przed testem sprawdź feed i w razie potrzeby zsynchronizuj GTFS
        required: true
        default: false
        type: boolean
      expected_text:
        description: Opcjonalny tekst, który ma się pojawić w odpowiedzi SMS
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - ".github/workflows/rail-journey-test.yml"
      - "supabase/functions/rail-gtfs-sync/index.ts"
      - "supabase/functions/assistant-tools/rail-route-search.ts"
      - "supabase/functions/assistant-tools/rail-stations.ts"
      - "supabase/functions/assistant-tools/index.ts"
      - "scripts/sync-rail-gtfs.mjs"
      - "supabase/migrations/20240143000000_rail_connections_from_raw_gtfs.sql"
      - "supabase/migrations/20240144000000_rail_connections_smaller_batches.sql"
      - "supabase/migrations/20240145000000_rail_connections_replace_in_place.sql"
      - "supabase/migrations/20240146000000_rail_calendar_cleanup_foreign_key.sql"
      - "supabase/migrations/20240147000000_rail_connections_reverse_search_scope.sql"
      - "supabase/migrations/20240148000000_rail_connections_corridor_search.sql"
      - "supabase/migrations/20240149000000_rail_connections_corridor_reverse_search.sql"
      - "supabase/migrations/20240150000000_rail_connections_batch_corridor.sql"
      - "supabase/migrations/20240151000000_rail_connections_geo_window.sql"
      - "supabase/migrations/20240152000000_rail_connections_trip_window.sql"
      - "supabase/migrations/20240153000000_rail_connections_compact_rpc.sql"

permissions:
  actions: read
  contents: read

jobs:
  test-journey:
    name: Test odpowiedzi o połączeniu kolejowym
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Poczekaj na wdrożenie zmian funkcji i bazy
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 90); do
            runs=$(curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100")
            deploy=$(jq -c --arg sha "${GITHUB_SHA}" \
              '[.workflow_runs[] | select(.head_sha == $sha and .name == "Deploy Supabase Edge Functions")] | sort_by(.created_at) | last // empty' \
              <<<"${runs}")
            if [[ -n "${deploy}" ]]; then
              status=$(jq -r '.status' <<<"${deploy}")
              if [[ "${status}" == "completed" ]]; then
                conclusion=$(jq -r '.conclusion' <<<"${deploy}")
                [[ "${conclusion}" == "success" ]] || { echo "Deploy zakończył się: ${conclusion}"; exit 1; }
                echo "Deploy migracji i funkcji zakończony poprawnie."
                exit 0
              fi
            elif [[ "${attempt}" -ge 6 ]]; then
              echo "Dla tego commita nie uruchomiono deployu; przechodzę do testu."
              exit 0
            fi
            sleep 10
          done
          echo "Nie znaleziono zakończonego deployu dla ${GITHUB_SHA} w ciągu 15 minut."
          exit 1

      - name: Sprawdź i odśwież GTFS
        if: ${{ inputs.refresh_gtfs || (github.event_name == 'push' && (contains(toJSON(github.event.head_commit.added), 'supabase/functions/rail-gtfs-sync/index.ts') || contains(toJSON(github.event.head_commit.modified), 'supabase/functions/rail-gtfs-sync/index.ts') || contains(toJSON(github.event.head_commit.added), 'scripts/sync-rail-gtfs.mjs') || contains(toJSON(github.event.head_commit.modified), 'scripts/sync-rail-gtfs.mjs') || contains(toJSON(github.event.head_commit.added), '20240143000000_rail_connections_from_raw_gtfs.sql') || contains(toJSON(github.event.head_commit.modified), '20240143000000_rail_connections_from_raw_gtfs.sql') || contains(toJSON(github.event.head_commit.added), '20240144000000_rail_connections_smaller_batches.sql') || contains(toJSON(github.event.head_commit.modified), '20240144000000_rail_connections_smaller_batches.sql') || contains(toJSON(github.event.head_commit.added), '20240145000000_rail_connections_replace_in_place.sql') || contains(toJSON(github.event.head_commit.modified), '20240145000000_rail_connections_replace_in_place.sql') || contains(toJSON(github.event.head_commit.added), '20240146000000_rail_calendar_cleanup_foreign_key.sql') || contains(toJSON(github.event.head_commit.modified), '20240146000000_rail_calendar_cleanup_foreign_key.sql')) ) }}
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
        run: node scripts/sync-rail-gtfs.mjs

      - name: Uruchom test end-to-end
        env:
          FROM_STATION: ${{ inputs.from || 'Katowice' }}
          TO_STATION: ${{ inputs.to || 'Zamość' }}
          TRAVEL_DATE: ${{ inputs.travel_date || 'jutro' }}
          PREFERRED_TIME: ${{ inputs.preferred_time || 'rano' }}
          REPLY_PARTS: ${{ inputs.reply_parts || '4' }}
          EXPECTED_SOURCE: ${{ inputs.expected_source || 'local' }}
          EXPECT_ROUTE: ${{ github.event_name == 'push' && 'true' || inputs.expect_route }}
          EXPECTED_LEGS: ${{ inputs.expected_legs || 'multiple' }}
          EXPECTED_VARIANTS: ${{ inputs.expected_variants || '1' }}
          EXPECTED_TEXT: ${{ inputs.expected_text }}
          ALLOW_LIVE_FALLBACK: ${{ inputs.use_live_fallback || 'false' }}
        run: node scripts/test-rail-journey.mjs
